name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create empty env files
        run: |
          touch .env
          touch .env.example

      - name: Decode or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully decoded debug.keystore!"
          else
            echo "debug.keystore.base64 not found, generating a new debug.keystore on the fly..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Successfully generated new debug.keystore!"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Copy and Rename APK to Haushaltsbuch.apk
        run: |
          mkdir -p apk
          rm -f apk/*.apk
          APK_DIR="app/build/outputs/apk/debug"
          cp "${APK_DIR}/app-debug.apk" "apk/Haushaltsbuch.apk"
          echo "NEW_APK_PATH=apk/Haushaltsbuch.apk" >> $GITHUB_ENV
          echo "CLEAN_PROJECT_NAME=Haushaltsbuch" >> $GITHUB_ENV
          echo "Renamed and copied APK to apk/Haushaltsbuch.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Haushaltsbuch-apk
          path: apk/

      - name: Commit and Push APK to Repo
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generated APK: Haushaltsbuch.apk [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes in APK folder to commit"
          fi

      - name: Delete Old Workflow Runs
        if: always()
        run: |
          echo "Deleting old workflow runs..."
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          runs=$(gh run list --json databaseId -q '.[].databaseId' 2>/dev/null || true)
          for run_id in $runs; do
            if [ -n "$run_id" ] && [ "$run_id" != "${{ github.run_id }}" ]; then
              echo "Deleting old run: $run_id"
              gh run delete "$run_id" || true
            fi
          done
